<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Infinite Scroll Zoom — 无限滚动缩放</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0906'/%3E%3Cpath d='M8 20 L16 9 L24 20 Z' fill='none' stroke='%23d9a05b' stroke-width='2'/%3E%3Ccircle cx='16' cy='9' r='2.4' fill='%23d9a05b'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://picsum.photos" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap"
/>
<style>
  /* demo-page chrome only — the engine styles live in styles.css */
  html, body { height: 100%; margin: 0; background: #0a0906; }
  #app { position: fixed; inset: 0; }
</style>
</head>
<body>
  <div id="app"></div>

  <!--
    Framework-agnostic engine. This bootstrap resolves the engine from a
    list of candidate locations so the same file works:
      • GitHub Pages  (site root: ./src/)
      • repo checkout over http (examples/: ../src/)
      • double-clicked from file:// (UMD fallback)
  -->
  <script>
    window.__FT_OPTS = {
      container: null, // filled below
      items: null,     // filled below
      ui: {
        hud: true, controls: true, hint: true, progress: true,
        eyebrow: 'A spatial scroll',
        title: 'Continuous Horizons',
        foot: 'scroll to fly · click a card to dive in',
      },
      motion: { inertia: 0.085, depthGap: 420, density: 24, lanes: 4,
                laneSpread: 1.05, autoCruise: 1.6 },
      style: { radius: 16, shadow: 60, panelW: 100 },
      onFocus:  info => console.log('[flythrough] focus', info),
      onRelease: info => console.log('[flythrough] release', info),
      onLaneChange: lane => console.log('[flythrough] lane →', lane),
    };
    window.__FT_ITEMS = (() => {
      // Self-hosted assets: no third-party image CDN dependency, so the demo
      // renders even on networks that block external CDNs.
      const IMG = id => `./assets/img${id}.jpg`;
      const IMAGES = [
        ['Dunes', 1015], ['Night Fields', 1016], ['Summit', 1018],
        ['Harbor', 1036], ['Lane', 1043], ['Wild', 1050],
        ['Stone', 1052], ['Vast', 1057], ['Glass', 1040],
        ['Gates', 1025], ['Peak', 1011], ['Meadow', 7],
      ].map(([title, id]) => ({ title, type: 'img', src: IMG(id) }));
      const VIDEOS = [
        ['Drift',   'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4'],
        ['Storm',   'https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_1MB.mp4'],
        ['Current', 'https://test-videos.co.uk/vids/jellyfish/mp4/h264/720/Jellyfish_720_10s_2MB.mp4'],
      ].map(([title, src]) => ({ title, type: 'video', src }));
      return IMAGES.flatMap((it, i) => (i % 4 === 2 ? [it, VIDEOS[(i / 4 | 0) % VIDEOS.length]] : [it]));
    })();
  </script>
  <script type="module">
    // ---- resolve engine location --------------------------------------
    // Candidates are tried in order; the first that loads wins. Each module
    // candidate also injects its matching stylesheet before importing.
    const ENGINE_PATHS = ['./src/infinite-flythrough.js', '../src/infinite-flythrough.js'];
    const CSS_PATHS    = ['./src/styles.css',            '../src/styles.css'];

    function loadCss(href){
      return new Promise((ok, err) => {
        const l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = href;
        l.onload = () => ok(href); l.onerror = () => err(new Error(href));
        document.head.appendChild(l);
      });
    }
    async function boot(){
      for (let i = 0; i < ENGINE_PATHS.length; i++){
        try {
          await loadCss(CSS_PATHS[i]);
          const mod = await import(ENGINE_PATHS[i]);
          window.__FT_OPTS.container = document.getElementById('app');
          window.__FT_OPTS.items = window.__FT_ITEMS;
          window.ft = mod.createFlythrough(window.__FT_OPTS);
          return;                                   // engine is live
        } catch (e) { /* try next candidate */ }
      }
      // ESM exhausted → UMD fallback (works from file://)
      try {
        await loadCss(CSS_PATHS[CSS_PATHS.length - 1]);
        await new Promise((ok, err) => {
          const s = document.createElement('script');
          s.src = './infinite-flythrough.umd.js';
          s.onload = ok; s.onerror = err;
          document.head.appendChild(s);
        });
        window.__FT_OPTS.container = document.getElementById('app');
        window.__FT_OPTS.items = window.__FT_ITEMS;
        window.ft = window.InfiniteFlythrough.createFlythrough(window.__FT_OPTS);
      } catch (e) {
        console.error('[flythrough] could not load the engine from any candidate path', e);
      }
    }
    boot();
  </script>
</body>
</html>
